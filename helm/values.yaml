replicaCount: 1

image:
  repository: 277383786265.dkr.ecr.eu-north-1.amazonaws.com/inference-api
  tag: v1
  pullPolicy: IfNotPresent

service:
  name: inference-api
  type: ClusterIP
  port: 80
  targetPort: 8080

env:
  LOG_LEVEL: INFO

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/metrics"
  prometheus.io/port: "8080"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
