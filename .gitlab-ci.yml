stages:
  - retrain
  - build
  - deploy

variables:
  IMAGE_TAG: v${CI_PIPELINE_IID}
  ECR_REGISTRY: 277383786265.dkr.ecr.eu-north-1.amazonaws.com
  ECR_REPOSITORY: inference-api
  AWS_DEFAULT_REGION: eu-north-1

# --- Stage 1: Retrain model ---
retrain-model:
  stage: retrain
  image: python:3.11-slim
  script:
    - pip install -r model/requirements.txt
    - python model/train.py
    - echo "Model retrained successfully"
  artifacts:
    paths:
      - model/artifacts/
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "trigger"
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - model/**/*

# --- Stage 2: Build and push Docker image ---
build-inference-image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - >
      echo "{\"credHelpers\":{\"${ECR_REGISTRY}\":\"ecr-login\"},
      \"credsStore\":\"ecr-login\"}" > /kaniko/.docker/config.json
  script:
    - >
      /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile $CI_PROJECT_DIR/Dockerfile
      --destination ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
      --destination ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - app/**/*
        - Dockerfile

# --- Stage 3: Update Helm tag for ArgoCD ---
bump-helm-tag:
  stage: deploy
  image: alpine:3.19
  before_script:
    - apk add --no-cache git yq
  script:
    - echo "Updating image tag to ${IMAGE_TAG}"
    - yq e ".image.tag = \"${IMAGE_TAG}\"" -i helm/values.yaml
    - git config user.email "ci-bot@gitlab.com"
    - git config user.name "CI Bot"
    - git add helm/values.yaml
    - git diff --cached --quiet && echo "No changes" && exit 0
    - git commit -m "ci: bump image tag to ${IMAGE_TAG}"
    - git push "https://oauth2:${CI_GIT_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git" HEAD:final-project
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - app/**/*
        - Dockerfile
